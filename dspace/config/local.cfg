google.analytics.key = G-V8J6YFFD4F

# Nombre max d’événements en buffer
google.analytics.buffer.limit = 256

# Cron pour envoyer les événements backend (téléchargements)
# Toutes les 5 minutes
google.analytics.cron = 0 0/5 * * * ?

# Bundles suivis pour les bitstreams
