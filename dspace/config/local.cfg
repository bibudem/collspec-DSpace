##### Paramètres pour la création des vignettes #####

# Largeur et hauteur maximales (en pixels) des vignettes générées
# REMARQUE : dans le thème de base de l’interface utilisateur, --ds-thumbnail-max-width est défini par défaut à 175px.
# Donc, si vous définissez thumbnail.maxwidth à une valeur > 175, vous devriez également modifier cette variable de style dans l’interface utilisateur
thumbnail.maxwidth  = 175
thumbnail.maxheight = 150

# the metadata to use to provide machine readable information about the resource right usage
iiif.license.uri = dc.rights.uri

# Pour ajouter des seeAlso à un item depuis un bundle spécifique
iiif.seealso.bundle = SEEALSO

# Pour ajouter du contenu OCR aux images
iiif.ocr.bundle = OCR
iiif.ocr.seealso.label = Contenu OCR
iiif.ocr.seealso.profile = http://www.loc.gov/standards/alto/v3/alto.xsd

# Pour ajouter des transcriptions aux images
iiif.transcriptions.bundle = TRANSCRIPTIONS
iiif.transcriptions.label = Transcriptions


########
# Configuration des uploads #
########
# Taille max d'un fichier unique "-1" pour illimité
spring.servlet.multipart.max-file-size = -1
# Taille max pour une requête (multi-fichiers)
spring.servlet.multipart.max-request-size = -1


##############################################
# Activation du stockage S3 dans DSpace 9.2  #
#####################################
# Région AWS
assetstore.s3.awsRegionName = ca-central-1

## corrections pour solr: search objects
discovery.highlights.escape-html = false


# Autoriser les origines spécifiques (client et middleware API)
#rest.cors.allowed-origins = http://localhost:3100, ${dspace.ui.url}

